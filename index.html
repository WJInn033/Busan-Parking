
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>부산 공영주차장</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>부산 공영주차장</h1>
        <p>부산의 공영주차장 정보를 확인해 보세요.</p>
    </header>

    <main>
        <h2>주차장 검색</h2>

        <form id="searchForm">
            <input
                type="text"
                id="searchInput"
                placeholder="주차장 이름을 입력하세요"
            >
            <button type="submit">검색</button>
        </form>

        <div id="result"></div>
    </main>

</body>
</html>
